<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kavárna styl draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
/* VOICE: a kid's sketchbook, pen on paper, stop-motion
   IDEA: everything is torn out of different papers and laid on a desk sheet
   PICTURE: the café scene, scribbled customers walking in behind each other
   COLOUR and TYPE: black ink, real paper tones (white, notebook, grid, old, kraft), Patrick Hand
   LAYOUT: phone first, one column */
:root{color-scheme:light;--paper:#efebe2;--ink:#1b1a17;--mut:#6d675c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:20px/1.3 "Patrick Hand",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:14px 12px 40px}
svg.d{overflow:visible;display:block}
.v{display:none}
body[data-f="0"] .v0,body[data-f="1"] .v1,body[data-f="2"] .v2{display:inline}
.scrap{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;min-height:46px;font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;isolation:isolate;transform:rotate(var(--r,0deg)) scale(var(--s,1));touch-action:manipulation}
.bgp{position:absolute;left:0;top:0;z-index:-1;overflow:visible;pointer-events:none}
.scrap:focus-visible{outline:2px dashed var(--ink);outline-offset:4px}
.scrap[aria-pressed=true]{text-decoration:underline wavy 1.5px;text-underline-offset:5px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cash{font-size:34px;padding:6px 22px;--r:-2deg}
.time{--r:2.5deg}
.tabs{display:flex;gap:10px;margin:14px 0 6px;justify-content:center}
.tabs .scrap:nth-child(1){--r:-1.5deg}.tabs .scrap:nth-child(2){--r:1deg}.tabs .scrap:nth-child(3){--r:-.5deg}
.scene{position:relative;height:340px;margin-top:6px;overflow-x:clip}
.cust-layer,.table-layer{position:absolute;inset:0}
.table-layer{z-index:5;pointer-events:none}
.tbl{position:absolute;bottom:0;width:31%}
.tbl:nth-child(1){left:1%}.tbl:nth-child(2){left:34.5%}.tbl:nth-child(3){left:68%}
.who{position:absolute;bottom:26px;left:0;width:30%;max-width:150px}
.ticket{position:absolute;z-index:6;top:0;display:flex;gap:4px;align-items:center;padding:6px 12px;font-size:18px}
.ticket svg.d{width:34px;height:34px}
.plates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.plate{flex-direction:column;padding:12px 6px 8px;gap:0;font-size:17px;line-height:1.1}
.plate svg.d{width:58px;height:58px}
.plate:nth-child(4n+1){--r:-2deg}.plate:nth-child(4n+2){--r:1.5deg}.plate:nth-child(4n+3){--r:-.8deg}.plate:nth-child(4n){--r:2deg}
.note{font-size:17px;color:var(--mut);margin:14px 4px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pane{display:none}.pane.on{display:block}
.q{font-size:28px;margin:14px 4px}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ans .scrap{min-height:72px;font-size:22px}
.ans .scrap:nth-child(1){--r:-1.5deg}.ans .scrap:nth-child(2){--r:1deg}.ans .scrap:nth-child(3){--r:.8deg}.ans .scrap:nth-child(4){--r:-1deg}
.shop .item{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:12px;justify-content:flex-start;width:100%;cursor:default}
.shop .item svg.d{width:56px;height:56px;flex:none}
.shop .grow{flex:1;line-height:1.1;text-align:left}.shop small{color:var(--mut);font-size:17px}
.shop .item:nth-child(odd){--r:-.6deg}.shop .item:nth-child(even){--r:.5deg}
.clean{font-family:Rubik,system-ui,sans-serif;font-size:16px}
.clean .bgp{display:none}
.clean .scrap,.clean .item{transform:none;border:1px solid #d8d2c6;border-radius:12px;background:#fff;text-decoration:none}
.clean .q{font-size:22px;font-weight:500}.clean .ans .scrap{font-size:16px}
.switch{margin:10px 4px;font-size:17px;color:var(--mut)}
#wipe{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;overflow:hidden}
#wipe svg{position:absolute;top:0;left:0;overflow:visible;will-change:transform}
@media(max-width:420px){.scene{height:300px}.ans{grid-template-columns:1fr}.ans .scrap{min-height:54px}.plate svg.d{width:48px;height:48px}.plate{font-size:15px}.q{font-size:24px}}
</style>
</head>
<body data-f="0">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="torn" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feDropShadow dx="1" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity=".22"/>
  </filter>
  <pattern id="p-noise" patternUnits="userSpaceOnUse" width="180" height="180"><image id="noise-img" width="180" height="180"/></pattern>
  <pattern id="p-lines" patternUnits="userSpaceOnUse" width="10" height="22"><line x1="0" x2="10" y1="21.5" y2="21.5" stroke="#8eaacd" stroke-width="1" opacity=".55"/></pattern>
  <pattern id="p-grid" patternUnits="userSpaceOnUse" width="14" height="14"><path d="M14 .5H.5V14" fill="none" stroke="#9db3cb" stroke-width=".7" opacity=".6"/></pattern>
</defs></svg>
<svg class="grain" aria-hidden="true"><rect width="100%" height="100%" fill="url(#p-noise)" opacity=".7"/></svg>

<div class="app">
  <div class="top">
    <span class="scrap cash">$120</span>
    <span class="scrap time">3:42</span>
  </div>
  <nav class="tabs">
    <button class="scrap" data-tab="cafe" aria-pressed="true">Kavárna</button>
    <button class="scrap" data-tab="quiz" aria-pressed="false">Zásoby</button>
    <button class="scrap" data-tab="shop" aria-pressed="false">Obchod</button>
  </nav>

  <section class="pane on" id="p-cafe">
    <div class="scene" id="scene">
      <div class="cust-layer" id="custs"></div>
      <div class="table-layer" id="tables"></div>
    </div>
    <div class="plates" id="plates"></div>
    <div class="row" style="margin-top:18px;justify-content:center"><button class="scrap btn" id="spawn" style="--r:-1deg">Přivést zákazníka</button></div>
    <p class="note">Ukázka stylu, nehraje se tu. Ťukej na „Přivést zákazníka“. Když jsou stoly plný, nejstarší zákazník odejde a přijde nový. Každej je jinej.</p>
  </section>

  <section class="pane" id="p-quiz">
    <div class="switch">Styl kvízu: <button class="scrap btn" data-style="quiz" data-v="paper" aria-pressed="true">papír</button> <button class="scrap btn" data-style="quiz" data-v="clean" aria-pressed="false">čistý</button></div>
    <div id="quiz-box">
      <div class="q">Kde v buňce probíhá fotosyntéza?</div>
      <div class="ans"><button class="scrap">V chloroplastech</button><button class="scrap">V mitochondriích</button><button class="scrap">V jádře</button><button class="scrap">V ribozomech</button></div>
    </div>
  </section>

  <section class="pane" id="p-shop">
    <div class="switch">Styl obchodu: <button class="scrap btn" data-style="shop" data-v="paper" aria-pressed="true">papír</button> <button class="scrap btn" data-style="shop" data-v="clean" aria-pressed="false">čistý</button></div>
    <div class="shop" id="shop-box"></div>
  </section>
</div>
<div id="wipe"><svg id="wipe-svg"></svg></div>

<script>
{
const NS='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const INK='#1b1a17',PAPER='#fbfaf6';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* paper texture tile */
{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),im=x.createImageData(180,180),R=rng(7);
 for(let i=0;i<im.data.length;i+=4){const v=R();im.data[i]=im.data[i+1]=im.data[i+2]=v<.5?60:255;im.data[i+3]=Math.abs(v-.5)*26}
 x.putImageData(im,0,0);x.strokeStyle='rgba(90,80,60,.10)';x.lineWidth=.6;
 for(let i=0;i<40;i++){const a=R()*180,b=R()*180,l=4+R()*10,t=R()*6.28;x.beginPath();x.moveTo(a,b);x.quadraticCurveTo(a+l/2,b+(R()-.5)*4,a+Math.cos(t)*l,b+Math.sin(t)*l);x.stroke()}
 document.getElementById('noise-img').setAttribute('href',c.toDataURL())}

/* torn paper shapes, no filters */
const PAPERS={white:{c:'#fdfcf8'},note:{c:'#fbfaf4',pat:'p-lines'},grid:{c:'#fafaf6',pat:'p-grid'},old:{c:'#f1e8d2'},kraft:{c:'#d8c3a0'},sticky:{c:'#f5e99a'}};
function tornPts(w,h,R,m=3){const pts=[],cut=[0,1,2,3].map(()=>R()<.5?4+R()*Math.min(w,h)*.22:0),ph=[R()*6.3,R()*6.3,R()*6.3,R()*6.3],big=R()*4|0;
  const C=[[m,m],[w-m,m],[w-m,h-m],[m,h-m]];
  for(let s=0;s<4;s++){const a=C[s],b=C[(s+1)%4],len=Math.hypot(b[0]-a[0],b[1]-a[1]),dx=(b[0]-a[0])/len,dy=(b[1]-a[1])/len,nx=dy,ny=-dx;
    const c0=cut[s],c1=cut[(s+1)%4],n=Math.max(2,Math.ceil((len-c0-c1)/5));
    for(let i=0;i<=n;i++){const d=c0+(len-c0-c1)*i/n;
      const off=1.6*Math.sin(d/31+ph[s])+.9*Math.sin(d/11+ph[(s+1)%4])+(R()*2-1)*(s===big?2.4:.9)-1.2;
      pts.push([a[0]+dx*d+nx*off,a[1]+dy*d+ny*off])}}
  return pts}
const toD=p=>'M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+'Z';
const KIND=[['.cash,.time','sticky'],['.tabs .scrap','white'],['.plate','old'],['.ans .scrap','note'],['.shop .item','grid'],['.ticket','note'],['.btn','kraft']];
const kindOf=el=>{for(const [sel,t] of KIND)if(el.matches(sel))return t;return 'white'};
let clipN=0;
function paperize(el){const type=kindOf(el),P=PAPERS[type],seed=Math.random()*1e9|0,st={creases:[],pressed:false},cid='cl'+(++clipN);
  const svg=mk('svg',{class:'bgp','aria-hidden':'true'});el.prepend(svg);
  const draw=()=>{const w=el.offsetWidth,h=el.offsetHeight;if(!w)return;const R=rng(seed);let pts=tornPts(w,h,R);
    if(st.pressed){const Q=rng(seed+st.creases.length*7);pts=pts.map(([x,y])=>{const k=.03+Q()*.035;return[x+(w/2-x)*k+(Q()-.5)*2,y+(h/2-y)*k*1.6+(Q()-.5)*2]})}
    const d=toD(pts),fib=toD(pts.map(q=>[q[0]+(R()*2-1)*1.3,q[1]+(R()*2-1)*1.3]));
    svg.setAttribute('width',w);svg.setAttribute('height',h);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML='';
    const cp=mk('clipPath',{id:cid});cp.append(mk('path',{d}));svg.append(cp);
    svg.append(mk('path',{d,fill:'rgba(0,0,0,.07)',transform:'translate(2.5 3.5)'}),mk('path',{d,fill:'rgba(0,0,0,.09)',transform:'translate(.8 1.4)'}),
      mk('path',{d:fib,fill:'#fff'}),mk('path',{d,fill:P.c}));
    if(P.pat)svg.append(mk('path',{d,fill:`url(#${P.pat})`}));
    svg.append(mk('path',{d,fill:'url(#p-noise)',opacity:type==='kraft'?'1':'.8'}));
    if(st.creases.length){const g=mk('g',{'clip-path':`url(#${cid})`});
      for(const c of st.creases){const P2=c.pts.map(([a,b])=>[a*w,b*h]);
        g.append(mk('polygon',{points:[...P2,c.far.map((v,i)=>v*(i?h:w))].map(q=>q.join(',')).join(' '),fill:`rgba(0,0,0,${c.shade})`}));
        const ld=P2.map(q=>q.join(',')).join(' ');
        g.append(mk('polyline',{points:ld,fill:'none',stroke:'rgba(0,0,0,.16)','stroke-width':1}));
        g.append(mk('polyline',{points:ld,fill:'none',stroke:'rgba(255,255,255,.75)','stroke-width':1,transform:'translate(.8 .9)'}))}
      svg.append(g)}};
  if(el.tagName==='BUTTON'){
    const crease=()=>{const Q=Math.random,vert=Q()<.5,pts=[];const n=3+(Q()*2|0);
      for(let i=0;i<=n;i++){const t=i/n;pts.push(vert?[.2+Q()*.6+(t-.5)*(Q()-.5)*.5,t*1.2-.1]:[t*1.2-.1,.15+Q()*.7+(t-.5)*(Q()-.5)*.6])}
      const far=vert?[Q()<.5?-.1:1.1,Q()]:[Q(),Q()<.5?-.1:1.1];
      st.creases.push({pts,far,shade:(.02+Q()*.035).toFixed(3)});if(st.creases.length>7)st.creases.shift()};
    const down=()=>{st.pressed=true;crease();crease();el.style.setProperty('--s','.94');draw()};
    const up=()=>{if(!st.pressed)return;setTimeout(()=>{st.pressed=false;el.style.setProperty('--s','1');draw()},110)};
    el.addEventListener('pointerdown',down);for(const ev of ['pointerup','pointerleave','pointercancel'])el.addEventListener(ev,up)}
  draw();new ResizeObserver(draw).observe(el)}

/* sketch doodles: 3 boil frames + torn cutout */
let seedN=1;
function doodle(vb,draw,pad=14){
  const svg=mk('svg',{viewBox:vb,class:'d'});if(!window.rough)return svg;
  const rc=rough.svg(svg),sil=mk('g');
  for(let f=0;f<3;f++){const g=mk('g',{class:'v v'+f});const base=(seedN+=7)*13;let k=0;
    const o=(x={})=>({stroke:INK,strokeWidth:1.9,roughness:2.1,bowing:2.4,fill:x.fill||'none',fillStyle:'hachure',hachureGap:5,fillWeight:1.3,...x,seed:base+(k++)*31+1});
    const add=(m,...a)=>{const n=rc[m](...a);g.append(n);return n};
    draw(add,o,f===0?(t,a)=>sil.append(mk(t,a)):()=>{});svg.append(g)}
  const base=svg.querySelector('.v0').cloneNode(true);base.setAttribute('class','');base.prepend(...sil.childNodes);
  const paint=(g,c)=>g.querySelectorAll('*').forEach(p=>{if(p.tagName==='g')return;p.setAttribute('stroke',c);p.setAttribute('stroke-width',pad);p.setAttribute('stroke-linejoin','round');p.setAttribute('stroke-linecap','round');p.setAttribute('fill',c)});
  const tex=base.cloneNode(true);paint(base,PAPER);paint(tex,'url(#p-noise)');
  const cut=mk('g',{filter:'url(#torn)'});cut.append(base,tex);svg.prepend(cut);return svg}

/* character generator */
function person(seed){
  const R=rng(seed),pick=a=>a[R()*a.length|0],rr=(a,b)=>a+R()*(b-a);
  if(R()<.15)return animal(R,pick,rr);
  const hr=rr(36,50),hx=100+rr(-4,4),hy=34+hr+rr(0,10),top=hy+hr-2;
  const body=pick(['dress','shirt','round','coat']),hair=pick(['pigtails','spiky','curly','long','bun','cap','mohawk','bob','tophat','bow','messy']);
  const held=pick(['popsicle','balloon','coffee','bag','flower','icecream','none','none']);
  const fs=pick([{fillStyle:'hachure'},{fillStyle:'zigzag'},{fillStyle:'cross-hatch'},{fillStyle:'dots',hachureGap:6},{fillStyle:'solid'},{fillStyle:'zigzag-line',hachureGap:7}]);
  const bf={fill:INK,hachureAngle:rr(-60,60),hachureGap:rr(4,7),...fs};
  const eyes=pick(['dots','rings','happy','dots']),mouth=pick(['smile','smile','open','wavy','o','tongue']);
  const glasses=R()<.22,beard=body!=='dress'&&R()<.18,freck=R()<.2,band=R()<.5,waveL=R()<.25,waveR=R()<.3;
  const curls=[];for(let i=0;i<=8;i++){const a=Math.PI+i/8*Math.PI;curls.push([hx+Math.cos(a)*(hr+4),hy+Math.sin(a)*(hr+4),rr(16,24)])}
  const messy=[];for(let i=0;i<14;i++){const a=Math.PI*rr(.9,2.1),r2=hr+rr(10,26);messy.push([hx+Math.cos(a)*hr*.6,hy+Math.sin(a)*hr*.6,hx+Math.cos(a)*r2,hy+Math.sin(a)*r2])}
  const fr=[];for(let i=0;i<6;i++)fr.push([hx+(i<3?-1:1)*rr(14,26),hy+rr(6,14)]);
  return doodle('0 0 200 300',(d,o,S)=>{
    S('circle',{cx:hx,cy:hy,r:hr});S('ellipse',{cx:hx,cy:hy-hr*.4,rx:hr+18,ry:hr*.9});
    if(body==='dress'){S('polygon',{points:`${hx-14},${top} ${hx+14},${top} ${hx+50},238 ${hx-50},238`});d('polygon',[[hx-14,top],[hx+14,top],[hx+50,236],[hx-50,236]],o(bf));if(band)d('rectangle',hx-48,236,96,14,o({fill:INK,fillStyle:'zigzag',hachureGap:4}))}
    if(body==='shirt'){S('rect',{x:hx-32,y:top,width:64,height:284-top});d('rectangle',hx-30,top,60,62,o(bf));d('rectangle',hx-28,top+62,26,284-top-62,o({fill:INK,hachureGap:5}));d('rectangle',hx+2,top+62,26,284-top-62,o({fill:INK,hachureGap:5}))}
    if(body==='round'){S('ellipse',{cx:hx,cy:(top+240)/2,rx:52,ry:(240-top)/2+6});d('ellipse',hx,(top+240)/2,102,240-top+10,o(bf))}
    if(body==='coat'){S('polygon',{points:`${hx-22},${top} ${hx+22},${top} ${hx+40},242 ${hx-40},242`});d('polygon',[[hx-22,top],[hx+22,top],[hx+40,240],[hx-40,240]],o(bf));for(const y of [top+24,top+50,top+76])d('circle',hx,y,7,o({fill:PAPER,fillStyle:'solid'}))}
    if(body!=='shirt'){d('line',hx-14,236,hx-16,284,o());d('line',hx+14,236,hx+16,284,o())}
    d('ellipse',hx-20,288,26,11,o({fill:INK,fillStyle:'solid'}));d('ellipse',hx+20,288,26,11,o({fill:INK,fillStyle:'solid'}));
    const sy=top+14,hl=[hx-56,waveL?top-26:top+58],hrr=[hx+56,waveR?top-26:top+58];
    d('line',hx-18,sy,...hl,o());d('line',hx+18,sy,...hrr,o());
    d('linearPath',[hrr,[hrr[0]+9,hrr[1]-6]],o());d('linearPath',[hrr,[hrr[0]+8,hrr[1]+7]],o());
    const [x,y]=hl;
    if(held==='popsicle'){S('ellipse',{cx:x-2,cy:y-36,rx:16,ry:32});d('ellipse',x-2,y-36,26,58,o({fill:INK,hachureGap:7,hachureAngle:50}));d('line',x,y-8,x+3,y+22,o({strokeWidth:2.4}))}
    if(held==='balloon'){S('circle',{cx:x-8,cy:y-92,r:26});d('circle',x-8,y-92,50,o({fill:INK,hachureGap:8}));d('curve',[[x-8,y-67],[x-2,y-45],[x-10,y-22],[x,y]],o({strokeWidth:1.3}))}
    if(held==='coffee'){S('rect',{x:x-16,y:y-28,width:34,height:40});d('rectangle',x-14,y-8,24,28,o());d('arc',x+12,y+6,14,14,-1.6,1.6,false,o());d('curve',[[x-6,y-12],[x-10,y-20],[x-4,y-28]],o({strokeWidth:1.3}))}
    if(held==='bag'){S('rect',{x:x-22,y:y-8,width:42,height:46});d('rectangle',x-18,y+6,34,30,o({fill:INK,fillStyle:'zigzag',hachureGap:5}));d('arc',x-1,y+6,22,22,Math.PI,2*Math.PI,false,o())}
    if(held==='flower'){S('circle',{cx:x,cy:y-40,r:20});d('line',x,y+6,x+1,y-30,o());d('circle',x,y-40,12,o({fill:INK,fillStyle:'solid'}));for(let i=0;i<5;i++){const a=i/5*6.28;d('circle',x+Math.cos(a)*12,y-40+Math.sin(a)*12,12,o())}}
    if(held==='icecream'){S('circle',{cx:x,cy:y-30,r:22});d('polygon',[[x-12,y-22],[x+12,y-22],[x+1,y+14]],o({fill:INK,fillStyle:'cross-hatch',hachureGap:5}));d('circle',x,y-34,30,o())}
    if(hair==='long'){for(const sd of [-1,1])for(let i=0;i<4;i++)d('line',hx+sd*(hr-6+i*3),hy-hr*.4,hx+sd*(hr+2+i*4),hy+hr+18,o({strokeWidth:1.5}))}
    if(hair==='bun')d('circle',hx,hy-hr-12,34,o({fill:INK,hachureGap:4}));

    const my=hy+hr*.35;

    if(freck)for(const [a,b] of fr)d('circle',a,b,2.5,o({fill:INK,fillStyle:'solid'}));
    if(beard)d('path',`M${hx-hr*.7} ${hy+hr*.2} C${hx-hr*.6} ${hy+hr+24} ${hx+hr*.6} ${hy+hr+24} ${hx+hr*.7} ${hy+hr*.2} C${hx+hr*.3} ${hy+hr*.6} ${hx-hr*.3} ${hy+hr*.6} ${hx-hr*.7} ${hy+hr*.2}Z`,o({fill:INK,fillStyle:'zigzag',hachureGap:3}));

  },16)}

    if(cat)for(const s of [-1,1])for(const dy of [-4,4])d('line',hx+s*12,hy+10,hx+s*44,hy+10+dy*2,o({strokeWidth:1.2}));
    else d('arc',hx,hy+22,14,16,0,Math.PI,true,o({fill:INK,hachureGap:3}))},16)}

/* build */
const tables=document.getElementById('tables');
for(let i=0;i<3;i++){const t=document.createElement('div');t.className='tbl';t.append(tableSvg());tables.append(t)}
const plates=document.getElementById('plates'),counts={toast:12,cereal:7,yogurt:3,juice:0,waffle:5,pancake:2,omelette:1,croissant:4},ptypes=['white','old','grid','kraft','note','white','old','grid'];
Object.keys(counts).forEach((id,i)=>{const b=document.createElement('button');b.className='scrap plate';b.append(foodSvg(id));
  const s=document.createElement('span');s.textContent=counts[id]+'× '+FOOD[id].n;b.append(s);plates.append(b)});

for(const [id,lvl,cost] of [['toast',2,'$130'],['cereal',1,'$100'],['yogurt',0,'']]){const r=document.createElement('div');r.className='scrap item';r.append(foodSvg(id));

document.querySelectorAll('.scrap').forEach(paperize);

let f=0;if(!reduce)setInterval(()=>{f=(f+1)%3;document.body.dataset.f=f},130);

/* customers: new ones walk behind those already seated; oldest leaves when full */
const custs=document.getElementById('custs'),scene=document.getElementById('scene'),seats=[null,null,null];
const fids=Object.keys(FOOD).slice(0,4);let tick=0;
function walk(el,from,to,done){let i=0;const n=Math.max(6,Math.round(Math.abs(to-from)/34));
  const fr=()=>{const x=from+(to-from)*i/n,b=i%2?-7:0,r=i>=n?0:(i%2?5:-4);el.style.transform=`translate(${x}px,${b}px) rotate(${r}deg)`;
    if(i++<n)setTimeout(fr,reduce?0:115);else done&&done()};fr()}
function seatX(s,el){const W=scene.clientWidth;return W*(0.01+s*0.335)+W*0.155-el.clientWidth/2}
function arrive(s){const el=document.createElement('div');el.className='who';el.style.zIndex=1;el.append(person(Math.random()*1e9|0));custs.append(el);
  const c={el,t:++tick,ticket:null};seats[s]=c;
  walk(el,-el.clientWidth-20,seatX(s,el),()=>{el.style.zIndex=3;showTicket(s,c)})}
function leave(s){const c=seats[s];seats[s]=null;c.ticket&&c.ticket.remove();c.el.style.zIndex=1;
  walk(c.el,seatX(s,c.el),scene.clientWidth+30,()=>c.el.remove())}
function showTicket(s,c){if(seats[s]!==c)return;const id=fids[Math.random()*4|0],q=1+(Math.random()*3|0);const t=document.createElement('div');t.className='scrap ticket';
  t.append(foodSvg(id));const sp=document.createElement('span');sp.textContent='×'+q;t.append(sp);custs.append(t);paperize(t);c.ticket=t;
  const cx=seatX(s,c.el)+c.el.clientWidth/2;t.style.left=Math.max(0,cx-48)+'px';
  const sc=[.4,.8,1.08,1];let i=0;const pop=()=>{t.style.transform=`rotate(${(s-1)*2}deg) scale(${sc[i]})`;if(++i<sc.length)setTimeout(pop,90)};pop()}
document.getElementById('spawn').addEventListener('click',()=>{let s=seats.indexOf(null);
  if(s<0){s=seats.reduce((a,c,i)=>c.t<seats[a].t?i:a,0);leave(s);setTimeout(()=>arrive(s),350)}else arrive(s)});

document.addEventListener('click',e=>{const b=e.target.closest('[data-style]');if(!b)return;
  b.parentElement.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.getElementById(b.dataset.style+'-box').classList.toggle('clean',b.dataset.v==='clean')});

/* torn notebook page wipes across, stop-motion, no filters */
const wipe=document.getElementById('wipe'),ws=document.getElementById('wipe-svg');
function sheetD(W,H,R){const e=x0=>{const p=[],ph=R()*6;for(let y=-20;y<=H+20;y+=12)p.push([x0+6*Math.sin(y/40+ph)+(R()*2-1)*6,y]);return p};
  return toD([...e(0),...e(W).reverse()])}
let busy=false;
function go(tab){if(busy)return;const cur=document.querySelector('.pane.on');if(cur.id==='p-'+tab)return;
  const swap=()=>{cur.classList.remove('on');document.getElementById('p-'+tab).classList.add('on');
    document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab))};
  if(reduce){swap();return}busy=true;
  const W=innerWidth*1.1,H=innerHeight,R=rng(Math.random()*1e9|0);
  ws.setAttribute('width',W);ws.setAttribute('height',H);ws.setAttribute('viewBox',`0 0 ${W} ${H}`);ws.innerHTML='';
  const sh=mk('path',{fill:'rgba(0,0,0,.12)',transform:'translate(-7 3)'}),pg=mk('path',{fill:'#fbfaf3'}),ln=mk('path',{fill:'url(#p-lines)'}),nz=mk('path',{fill:'url(#p-noise)'});
  ws.append(sh,pg,ln,nz,mk('line',{x1:44,x2:44,y1:0,y2:H,stroke:'#d98a8a','stroke-width':1.4,opacity:.7}));
  wipe.style.display='block';const steps=6,from=innerWidth+30,mid=-(W-innerWidth)/2,to=-W-40;let i=0;
  const fr=()=>{const d=sheetD(W,H,R);for(const p of [sh,pg,ln,nz])p.setAttribute('d',d);
    const half=i<=steps,t=half?i/steps:(i-steps)/steps,x=half?from+(mid-from)*t:mid+(to-mid)*t;
    ws.style.transform=`translateX(${x.toFixed(0)}px) rotate(${(R()*2-1).toFixed(2)}deg)`;
    if(i===steps)swap();
    if(i++<steps*2)setTimeout(fr,i===steps+1?170:90);else{wipe.style.display='none';busy=false}};
  fr()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
}
